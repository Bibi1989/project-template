# =============================================================================
# Deploy Frontend → Google Artifact Registry → Helm upgrade on GKE
# Triggers on pushes to main that touch services/frontend/ (or this workflow).
#
# GCP deploy is commented out for now (local / non-GCP workflows).
# Uncomment the build-and-deploy job steps below when GCP is ready.
#
# Required GitHub repository variables / secrets (when re-enabled):
#   vars.GCP_PROJECT_ID
#   vars.GCP_REGION                 (e.g. us-central1)
#   vars.GAR_REPOSITORY             (e.g. template-containers)
#   vars.GKE_CLUSTER_NAME
#   vars.GKE_CLUSTER_LOCATION       (region or zone)
#   vars.HELM_RELEASE_NAME          (e.g. template-app)
#   vars.HELM_NAMESPACE             (e.g. template)
#   vars.WIF_PROVIDER               (//iam.googleapis.com/projects/.../providers/...)
#   vars.WIF_SERVICE_ACCOUNT        (github-actions@PROJECT.iam.gserviceaccount.com)
# =============================================================================
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "services/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # id-token: write  # required for GCP Workload Identity Federation

env:
  SERVICE: frontend
  IMAGE_NAME: frontend
  WORKING_DIR: services/frontend

jobs:
