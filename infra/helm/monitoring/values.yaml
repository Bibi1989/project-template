# =============================================================================
# kube-prometheus-stack overrides
#
# Install into namespace template-monitoring (see README.md):
#   helm upgrade --install template-monitoring prometheus-community/kube-prometheus-stack \
#     -n template-monitoring --create-namespace -f values.yaml
#
# Scrapes apps in the template namespace via ServiceMonitors from the app chart
# and/or prometheus.io annotations on pods.
# =============================================================================

fullnameOverride: template-monitoring

# Prometheus Operator CRDs are required for ServiceMonitor / PodMonitor
crds:
  enabled: true

# -----------------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Discover ServiceMonitors / PodMonitors in any namespace (incl. template)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    # Also scrape pods with prometheus.io/* annotations
    additionalScrapeConfigs:
      - job_name: kubernetes-pods-annotations
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - template
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: replace
            target_label: component
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # Local / kind: no PVC (avoids needing a default StorageClass)
    storageSpec: {}

# -----------------------------------------------------------------------------
# Grafana
# -----------------------------------------------------------------------------
grafana:
  adminUser: admin
  adminPassword: changeme
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Pre-provision Prometheus datasource (in-cluster)
  additionalDataSources: []
  # Default dashboards from the chart are enough to start
  defaultDashboardsEnabled: true
  service:
    type: ClusterIP

# -----------------------------------------------------------------------------
# Alertmanager — keep light for local
# -----------------------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage: {}
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# -----------------------------------------------------------------------------
# Components we do not need for a small template cluster
# -----------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: true

nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
