# =============================================================================
# LOCAL defaults — Docker Desktop / kind / minikube
#
# Apps are defined under `apps.<name>`. Each enabled entry gets a Deployment,
# Service, and optional HPA / PDB / PodMonitoring from the shared templates.
#
#   docker build -t template-frontend:local ../../frontend
#   docker build -t template-backend:local  ../../backend
#   kind load docker-image template-frontend:local -n template
#
# Install:
#   helm upgrade --install template-app . -n template --create-namespace
#
# Naming: change global.namePrefix (sync with infra/config.env NAME_PREFIX).
# Production / GKE: also pass -f values-production.yaml.
# =============================================================================

global:
  projectId: ""
  region: ""
  environment: local
  gcpServiceAccount: ""
  namePrefix: template

nameOverride: ""
fullnameOverride: ""

# Bump via --set rolloutDate="$(date +%s)" to force a rolling restart
rolloutDate: ""

# -----------------------------------------------------------------------------
# Workloads — add/remove keys freely; templates range over this map
# -----------------------------------------------------------------------------
apps:
  frontend:
    enabled: true
    name: deployment-frontend
    replicaCount: 1
    image:
      repository: template-frontend
      tag: local
      pullPolicy: Never
    service:
      name: service-frontend
      type: ClusterIP
      port: 3000
      targetPort: 3000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    probes:
      liveness:
        path: /
        initialDelaySeconds: 20
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        path: /
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
    # Container security / volumes
    readOnlyRootFilesystem: false
    emptyDirTmp: false
    env:
      - name: NODE_ENV
        value: development
      # host.docker.internal = Mac/Windows Docker Desktop / kind host (not localhost)
      - name: DATABASE_URL
        value: postgresql://postgres:postgres@host.docker.internal:5420/postgres
      - name: PORT
        value: "3000"
      - name: NEXT_PUBLIC_API_BASE_URL
        value: /api
      - name: NEXT_PUBLIC_APP_URL
        value: http://127.0.0.1:3000
      - name: BACKEND_URL
        value: http://service-backend:8000
      - name: ENVIRONMENT
        value: local
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    monitoring:
      scrape: true
      path: /metrics
      podMonitoring: false

  backend:
    enabled: false
    name: deployment-backend
    replicaCount: 1
    image:
      repository: template-backend
      tag: local
      pullPolicy: Never
    service:
      name: service-backend
      type: ClusterIP
      port: 8000
      targetPort: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 750m
        memory: 768Mi
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        path: /health
        initialDelaySeconds: 8
        periodSeconds: 8
        timeoutSeconds: 5
        failureThreshold: 3
    readOnlyRootFilesystem: true
    emptyDirTmp: true
    env:
      - name: APP_NAME
        value: template-api
      - name: ENVIRONMENT
        value: local
      - name: PORT
        value: "8000"
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    monitoring:
      scrape: true
      path: /metrics
      podMonitoring: false

# -----------------------------------------------------------------------------
# Secrets — choose provider:
#   kubernetes → kind: Secret (secret.yaml) — local / any cluster
#   csi          → kind: SecretProviderClass — GCP Secret Manager
# -----------------------------------------------------------------------------
secrets:
  enabled: true
  provider: kubernetes # kubernetes | csi
  stringData:
    DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:5420/postgres"
    API_SECRET_KEY: "local-dev-change-me"
    CORS_ORIGINS: "*"
  providerClassName: ""
  mountPath: /var/secrets
  syncSecretName: ""
  csi:
    provider: gcp
  secretKeys:
    DATABASE_URL: ""
    API_SECRET_KEY: ""
    CORS_ORIGINS: ""

# -----------------------------------------------------------------------------
# ConfigMap — non-sensitive app config (kind: ConfigMap)
# -----------------------------------------------------------------------------
configMap:
  enabled: true
  name: "" # defaults to {namePrefix}-app-config
  envFrom: true
  data:
    APP_NAME: template-api
    LOG_FORMAT: json

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: true
  className: nginx
  name: ""
  host: ""
  tls:
    enabled: false
    secretName: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  # Each path targets an apps.<key> Service (resolved at render time)
  paths:
    - path: /api(?:/|$)(.*)
      pathType: ImplementationSpecific
      app: backend
    - path: /?(.*)
      pathType: ImplementationSpecific
      app: frontend

monitoring:
  # Global switch for GMP PodMonitoring CRDs (GKE). Per-app: apps.*.monitoring.podMonitoring
  podMonitoring:
    enabled: false
    interval: 30s
  scrapeAnnotations: true

logging:
  level: debug
  structured: "true"
  configMap:
    enabled: true

# Global HPA gate — per-app: apps.*.autoscaling.enabled
autoscaling:
  enabled: false

# Global PDB gate — per-app: apps.*.podDisruptionBudget.enabled
podDisruptionBudget:
  enabled: false
