{{- /*
Optional namespace annotation helper for Cloud Logging log views.
Applied as a ConfigMap so operators can document expected log queries.
*/ -}}
{{- if .Values.logging.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-logging
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.logging.level | quote }}
  STRUCTURED_LOGS: {{ .Values.logging.structured | quote }}
  # Example Cloud Logging filter for this release
  CLOUD_LOGGING_FILTER: |
    resource.type="k8s_container"
    resource.labels.namespace_name="{{ .Release.Namespace }}"
    labels."k8s-pod/app_kubernetes_io/instance"="{{ .Release.Name }}"
{{- end }}
