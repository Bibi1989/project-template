{{- /*
GCP Secret Manager via CSI SecretProviderClass.
Enable with:
  secrets.enabled: true
  secrets.provider: csi
  global.projectId: <gcp-project>
*/ -}}
{{- if eq (include "app.secretsCsi" .) "true" }}
{{- if not .Values.global.projectId }}
{{- fail "global.projectId is required when secrets.provider=csi" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "app.secretProviderClassName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.csi.provider | default "gcp" }}
  parameters:
    secrets: |
      {{- range $key, $_ := .Values.secrets.secretKeys }}
      - resourceName: {{ include "app.secretResourceName" (list $ $key) | quote }}
        path: {{ $key | quote }}
      {{- end }}
  secretObjects:
    - secretName: {{ include "app.syncSecretName" . }}
      type: Opaque
      data:
        {{- range $key, $_ := .Values.secrets.secretKeys }}
        - objectName: {{ $key | quote }}
          key: {{ $key | quote }}
        {{- end }}
{{- end }}
