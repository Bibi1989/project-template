{{- if .Values.secrets.enabled }}
{{- if not .Values.global.projectId }}
{{- fail "global.projectId is required when secrets.enabled=true (used to resolve Secret Manager resource names)" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.providerClassName }}
  labels:
    {{- include "turnkey-app.labels" . | nindent 4 }}
spec:
  provider: gcp
  parameters:
    secrets: |
      {{- range $key, $_ := .Values.secrets.secretKeys }}
      - resourceName: {{ include "turnkey-app.secretResourceName" (list $ $key) | quote }}
        path: {{ $key | quote }}
      {{- end }}
  # Sync mounted files into a native Kubernetes Secret for envFrom consumption
  secretObjects:
    - secretName: {{ .Values.secrets.syncSecretName }}
      type: Opaque
      data:
        {{- range $key, $_ := .Values.secrets.secretKeys }}
        - objectName: {{ $key | quote }}
          key: {{ $key | quote }}
        {{- end }}
{{- end }}
