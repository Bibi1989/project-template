{{- range $key, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.service.name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
spec:
  type: {{ $app.service.type }}
  selector:
    {{- include "app.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $key }}
  ports:
    - name: http
      port: {{ $app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
