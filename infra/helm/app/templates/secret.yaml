{{- /*
Native Kubernetes Secret (local / non-GCP clusters).
Enable with:
  secrets.enabled: true
  secrets.provider: kubernetes
*/ -}}
{{- if eq (include "app.secretsKubernetes" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.syncSecretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
