# values-aws.yaml — example overrides for Amazon EKS
#
# Usage:
#   helm upgrade --install template-app . -n template --create-namespace \
#     -f values.yaml -f values-aws.yaml \
#     --set frontend.image.repository=$ECR/frontend \
#     --set frontend.image.tag=$TAG \
#     --set backend.image.repository=$ECR/backend \
#     --set backend.image.tag=$TAG
#
# Prerequisites (outside this chart):
#   - EKS cluster + ingress-nginx (or AWS Load Balancer Controller + ingress class)
#   - ECR repositories for frontend/backend
#   - Optional: External Secrets Operator / Secrets Store CSI (AWS provider) if you
#     outgrow plain kubernetes Secrets — this stub keeps secrets.provider=kubernetes.

global:
  environment: production
  region: us-east-1
  projectId: ""
  gcpServiceAccount: ""

frontend:
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/template-frontend
    tag: latest
    pullPolicy: IfNotPresent
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: NEXT_PUBLIC_API_BASE_URL
      value: /api
    - name: BACKEND_URL
      value: http://service-backend:8000
    - name: ENVIRONMENT
      value: production

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/template-backend
    tag: latest
    pullPolicy: IfNotPresent
  env:
    - name: APP_NAME
      value: template-api
    - name: ENVIRONMENT
      value: production
    - name: PORT
      value: "8000"

# Portable path: native K8s Secret (not GCP CSI)
secrets:
  enabled: true
  provider: kubernetes
  stringData:
    DATABASE_URL: "postgresql://REPLACE:REPLACE@db:5432/app"
    API_SECRET_KEY: "REPLACE_ME"
    CORS_ORIGINS: "*"

configMap:
  enabled: true
  envFrom: true

# GMP PodMonitoring is GKE-only
monitoring:
  podMonitoring:
    enabled: false

autoscaling:
  enabled: true
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  # For IRSA, set annotations e.g.:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/template-app
  annotations: {}
