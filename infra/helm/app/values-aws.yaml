# values-aws.yaml — example overrides for Amazon EKS
#
# Usage:
#   helm upgrade --install template-app . -n template --create-namespace \
#     -f values.yaml -f values-aws.yaml \
#     --set apps.frontend.image.repository=$ECR/frontend \
#     --set apps.frontend.image.tag=$TAG \
#     --set apps.backend.image.repository=$ECR/backend \
#     --set apps.backend.image.tag=$TAG

global:
  environment: production
  region: us-east-1
  projectId: ""
  gcpServiceAccount: ""

apps:
  frontend:
    replicaCount: 2
    image:
      repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/template-frontend
      tag: latest
      pullPolicy: IfNotPresent
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
      - name: NEXT_PUBLIC_API_BASE_URL
        value: /api
      - name: BACKEND_URL
        value: http://service-backend:8000
      - name: ENVIRONMENT
        value: production
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  backend:
    enabled: true
    replicaCount: 2
    image:
      repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/template-backend
      tag: latest
      pullPolicy: IfNotPresent
    env:
      - name: APP_NAME
        value: template-api
      - name: ENVIRONMENT
        value: production
      - name: PORT
        value: "8000"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

secrets:
  enabled: true
  provider: kubernetes
  stringData:
    DATABASE_URL: "postgresql://REPLACE:REPLACE@db:5432/app"
    API_SECRET_KEY: "REPLACE_ME"
    CORS_ORIGINS: "*"

configMap:
  enabled: true
  envFrom: true

monitoring:
  podMonitoring:
    enabled: false

autoscaling:
  enabled: true

podDisruptionBudget:
  enabled: true

serviceAccount:
  create: true
  # Set from Pulumi: pulumi stack output irsaAppRoleArn
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/template-app
  annotations: {}
