# values-azure.yaml — example overrides for Azure AKS
#
# Usage:
#   helm upgrade --install template-app . -n template --create-namespace \
#     -f values.yaml -f values-azure.yaml \
#     --set apps.frontend.image.repository=$ACR/frontend \
#     --set apps.frontend.image.tag=$TAG \
#     --set apps.backend.image.repository=$ACR/backend \
#     --set apps.backend.image.tag=$TAG

global:
  environment: production
  region: westeurope
  projectId: ""
  gcpServiceAccount: ""

apps:
  frontend:
    replicaCount: 2
    image:
      repository: myregistry.azurecr.io/template-frontend
      tag: latest
      pullPolicy: IfNotPresent
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
      - name: NEXT_PUBLIC_API_BASE_URL
        value: /api
      - name: BACKEND_URL
        value: http://service-backend:8000
      - name: ENVIRONMENT
        value: production
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  backend:
    enabled: true
    replicaCount: 2
    image:
      repository: myregistry.azurecr.io/template-backend
      tag: latest
      pullPolicy: IfNotPresent
    env:
      - name: APP_NAME
        value: template-api
      - name: ENVIRONMENT
        value: production
      - name: PORT
        value: "8000"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

secrets:
  enabled: true
  provider: kubernetes
  stringData:
    DATABASE_URL: "postgresql://REPLACE:REPLACE@db:5432/app"
    API_SECRET_KEY: "REPLACE_ME"
    CORS_ORIGINS: "*"

configMap:
  enabled: true
  envFrom: true

monitoring:
  podMonitoring:
    enabled: false

autoscaling:
  enabled: true

podDisruptionBudget:
  enabled: true

serviceAccount:
  create: true
  # For Azure Workload Identity:
  # annotations:
  #   azure.workload.identity/client-id: "<app-client-id>"
  annotations: {}
